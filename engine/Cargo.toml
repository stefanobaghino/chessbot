[package]
name = "chessbot-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chessbot-engine"
path = "src/main.rs"

[features]
# Search margins become UCI options that a tuner can set between games (#39).
tune = []

[dependencies]
cozy-chess = "0.3"
libc = "0.2"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
